name: CI Test Suite

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install xmllint (libxml2)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils

      - name: Verify Formatting (gofmt)
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Arquivos desalinhados com gofmt:"
            gofmt -l .
            exit 1
          fi

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Tests with Coverage
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Build Examples
        run: |
          go build -o /dev/null ./examples/...
