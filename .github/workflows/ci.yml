name: CI Test Suite

on:
  push:
    branches:
      - main
      - 'release/v*'
    tags: [ 'v*' ]
  pull_request:
    branches:
      - main
      - 'release/v*'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-policy:
    name: Validate Version Policy
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag name and ancestry
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag inválida: $version. Use vMAJOR.MINOR.PATCH."
            exit 1
          fi
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --force
          release_line="${version%.*}"
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            exit 0
          fi
          if git show-ref --verify --quiet "refs/remotes/origin/release/$release_line" &&
             git merge-base --is-ancestor "$GITHUB_SHA" "origin/release/$release_line"; then
            exit 0
          fi
          echo "A tag $version não pertence a main nem a release/$release_line."
          exit 1

  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install xmllint (libxml2)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils

      - name: Verify Formatting (gofmt)
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Arquivos desalinhados com gofmt:"
            gofmt -l .
            exit 1
          fi

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Tests with Coverage
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Build Examples
        run: |
          go build -o /dev/null ./examples/...
